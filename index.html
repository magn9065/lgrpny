<head>
  <meta charset="UTF-8" />

<script type='text/javascript' src='https://api.netlify.com/-00hQMlrVnOsbFUQ-0oRNwW5suCWe_Vfcpqehch2ziyOAGFLPVadOqubIbKIhoss4YD5xY8BuEOTZH6ASv22aAqOaAzyjINWFossGOk-tbzzYa1V6m0J0ya9g6z1mEWh317AgRO1t4v2Y_BDOCLTi-L9470UKFtAbyfnnZslwVvLGnGSE9PozxxI1B3-zX99Q_JLIOXUyPlGbx7woy-s4r6jGh-RqCRYfmzK3F86-N4LE_w4qfd0ffpQFKcAeAuVj650GCO9d-hJ47-bv7_b1LKY8y3xjEfSxIwm_cWYGkX6PCrcfcTCReWXRlEQH8L0995qVdJW1h7W5HX08TZ-fZx0KqW6oYMbiE5S1HMUDsH1e7Un2a-IoTE1__kJMZPM71TZWXEdRAGs8ORoKvCj6kDpuMBRqbYk1T2uiWOFHrNohKDZHjL3tJbgPRNYYZ2EwfMpksUB6oA7q8G0F60EKqVNzEJjgbYUbNe_guun0sBiaVqCBDyhsQXqW3OaqjKfBuKyg7FMKnSktMzgggYz'></script></head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1><span>Ignite</span> Faktura</h1>
      </div>

      <label class="class-picker">
        Bilklasse
        <select id="carClass">
          <option value="S">S-Klasse</option>
          <option value="A">A-Klasse</option>
          <option value="B">B-Klasse</option>
          <option value="C">C-Klasse</option>
          <option value="D">D-Klasse</option>
        </select>
      </label>
    </header>

    <section class="parts-wrap">
      <div class="section-title">
        <h2 id="partsTitle">S-Klasse dele</h2>
        <span></span>
      </div>

      <div id="parts" class="parts"></div>
    </section>

    <footer class="bottom-bar">
      <div>
        <span class="muted">Total</span>
        <strong id="totalPrice">0 kr.</strong>
      </div>

      <div class="actions">
        <button onclick="openConfirmModal()">Godkend faktura</button>
        <button class="ghost" onclick="resetForm()">Nulstil</button>
      </div>
    </footer>

    <p id="status" class="status hidden-status">Klar til ny faktura.</p>
  </main>

  <section class="brand-logo-wrap" aria-label="Livery Lab logo">
    <img src="assets/livery-lab-logo.png" alt="Livery Lab" class="brand-logo" />
  </section>

  <div id="invoiceModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Godkend faktura</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>

      <p class="modal-text">
        Tryk én gang på "Gem faktura". Knappen skifter til "Sikker?". Tryk derefter igen for at gemme, kopiere teksten og nulstille alle valg.
      </p>

      <textarea id="invoiceText" readonly></textarea>

      <div class="modal-total">
        <span>Total</span>
        <strong id="modalTotalPrice">0 kr.</strong>
      </div>

      <div class="actions">
        <button id="saveInvoiceBtn" onclick="approveInvoice()">Gem faktura</button>
        <button class="secondary" onclick="copyInvoice()">Kopiér tekst</button>
        <button class="ghost" onclick="closeModal()">Tilbage</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
